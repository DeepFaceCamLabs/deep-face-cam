name: Feature request
description: Suggest an improvement.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Requests that enable deception, impersonation, harassment, or non-consensual intimate imagery will be closed.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should change in the app?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: responsible_use
    attributes:
      label: Responsible-use confirmation
      options:
        - label: This request is compatible with the responsible-use policy.
          required: true
