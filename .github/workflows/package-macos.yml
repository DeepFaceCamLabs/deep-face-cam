name: Package macOS

on:
  workflow_dispatch:
    inputs:
      retention-days:
        description: Artifact retention days
        required: false
        default: "14"
      signed:
        description: Sign and notarize with Developer ID secrets
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  macos-dmg:
    name: macOS DMG (${{ matrix.name }}, ${{ inputs.signed && 'signed' || 'unsigned' }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon
            runner: macos-15
            artifact_suffix: apple-silicon-arm64
          - name: Intel
            runner: macos-15-intel
            artifact_suffix: intel-x64
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Rust toolchain
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            . "$HOME/.cargo/env"
          fi
          rustup toolchain install stable --profile minimal
          rustup default stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Runner details
        run: |
          sw_vers
          uname -m
          node --version
          node -p "process.arch"
          python3 --version
          python3 -c "import platform; print(platform.machine())"
          rustc --version

      - run: npm ci

      - name: Prepare packaging Python
        run: npm run packaging:python:macos

      - name: Import Developer ID certificate
        if: ${{ inputs.signed }}
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          test -n "$APPLE_CERTIFICATE_P12_BASE64"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          KEYCHAIN_PATH="$RUNNER_TEMP/deepfacecam-signing.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id-application.p12"
          echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -p codesigning "$KEYCHAIN_PATH" | grep -q "1 valid identities found"

      - name: Prepare App Store Connect API key
        if: ${{ inputs.signed }}
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          test -n "$APPLE_API_KEY_ID"
          test -n "$APPLE_API_ISSUER_ID"
          test -n "$APPLE_API_KEY_P8"
          API_KEY_DIR="$RUNNER_TEMP/private_keys"
          API_KEY_PATH="$API_KEY_DIR/AuthKey_${APPLE_API_KEY_ID}.p8"
          mkdir -p "$API_KEY_DIR"
          printf '%s' "$APPLE_API_KEY_P8" > "$API_KEY_PATH"
          echo "APPLE_API_KEY_PATH=$API_KEY_PATH" >> "$GITHUB_ENV"

      - name: Build unsigned macOS DMG
        if: ${{ !inputs.signed }}
        env:
          CI: "true"
        run: npm run tauri:build:macos

      - name: Build signed and notarized macOS DMG
        if: ${{ inputs.signed }}
        env:
          CI: "true"
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: npm run tauri:build:macos:notarized

      - name: Generate checksums
        run: npm run release:checksums

      - name: List release artifacts
        run: |
          find src-tauri/target/release/bundle -maxdepth 4 -type f \( -name '*.dmg' -o -name 'SHA256SUMS.txt' \) -print

      - uses: actions/upload-artifact@v7
        with:
          name: deepfacecam-macos-${{ inputs.signed && 'signed' || 'unsigned' }}-${{ matrix.artifact_suffix }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: ${{ fromJSON(inputs['retention-days']) }}
