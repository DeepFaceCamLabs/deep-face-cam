name: Package macOS

on:
  workflow_dispatch:
    inputs:
      retention-days:
        description: Artifact retention days
        required: false
        default: "14"

permissions:
  contents: read

jobs:
  macos-dmg-unsigned:
    name: Unsigned macOS DMG (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon
            runner: macos-15
            artifact_suffix: apple-silicon-arm64
          - name: Intel
            runner: macos-15-intel
            artifact_suffix: intel-x64
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Rust toolchain
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            . "$HOME/.cargo/env"
          fi
          rustup toolchain install stable --profile minimal
          rustup default stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Runner details
        run: |
          sw_vers
          uname -m
          node --version
          node -p "process.arch"
          python3 --version
          python3 -c "import platform; print(platform.machine())"
          rustc --version

      - run: npm ci

      - name: Prepare packaging Python
        run: npm run packaging:python:macos

      - name: Build unsigned macOS DMG
        env:
          CI: "true"
        run: npm run tauri:build:macos

      - name: Generate checksums
        run: npm run release:checksums

      - name: List release artifacts
        run: |
          find src-tauri/target/release/bundle -maxdepth 4 -type f \( -name '*.dmg' -o -name 'SHA256SUMS.txt' \) -print

      - uses: actions/upload-artifact@v7
        with:
          name: deepfacecam-macos-unsigned-${{ matrix.artifact_suffix }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: ${{ fromJSON(inputs['retention-days']) }}
