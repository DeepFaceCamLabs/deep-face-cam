name: Release Check

on:
  workflow_dispatch:

jobs:
  checklist:
    name: Release checklist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run open-source:check
      - name: Print manual checklist
        run: sed -n '1,240p' docs/OPEN_SOURCE_RELEASE.md
